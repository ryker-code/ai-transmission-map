name: Deploy to Vercel
# NOTE: This workflow requires three GitHub repository secrets to be set:
#   VERCEL_TOKEN      — from vercel.com/account/tokens
#   VERCEL_ORG_ID     — from vercel.com/[your-team]/settings (or personal: vercel.com/account)
#   VERCEL_PROJECT_ID — from vercel.com/[project]/settings
# Until those secrets are set, this workflow is disabled (on: workflow_dispatch only).
# See docs/DEPLOYMENT_GUIDE.md for step-by-step setup instructions.

on:
  workflow_dispatch:  # Manual trigger only until secrets are configured
  # Uncomment the lines below once VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID are set:
  # push:
  #   branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8000' }}
          NEXT_PUBLIC_API_KEY: ${{ secrets.NEXT_PUBLIC_API_KEY || 'dev-key-change-in-production' }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: '--prod'
