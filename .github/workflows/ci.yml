name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Run py_compile on all backend files
        run: find backend -name "*.py" | grep -v __pycache__ | xargs python -m py_compile

      - name: Run pytest
        run: python -m pytest backend/tests/ -v --tb=short
        env:
          ANTHROPIC_API_KEY: sk-test-placeholder
          GOOGLE_API_KEY: test-placeholder
          OPENAI_API_KEY: sk-test-placeholder
          BIGQUERY_PROJECT_ID: ""
          BIGQUERY_DATASET: ai_transmission_map
          GOOGLE_CLOUD_PROJECT: ""
          AITM_API_KEY: dev-key-change-in-production

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install chromium --with-deps
        continue-on-error: true

      - name: Run Playwright E2E tests
        run: cd frontend && npx playwright test --reporter=list
        continue-on-error: true
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Report test summary
        if: always()
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Python tests: \`$(python -m pytest backend/tests/ --co -q 2>/dev/null | tail -1)\`" >> $GITHUB_STEP_SUMMARY
          echo "- Next.js pages: 14+" >> $GITHUB_STEP_SUMMARY
