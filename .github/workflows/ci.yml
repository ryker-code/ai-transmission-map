name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Run py_compile on all backend files
        run: find backend -name "*.py" | grep -v __pycache__ | xargs python -m py_compile

      - name: Run pytest
        run: python -m pytest backend/tests/ -v --tb=short
        env:
          ANTHROPIC_API_KEY: sk-test-placeholder
          GOOGLE_API_KEY: test-placeholder
          OPENAI_API_KEY: sk-test-placeholder
          BIGQUERY_PROJECT_ID: ""
          BIGQUERY_DATASET: ai_transmission_map
          GOOGLE_CLOUD_PROJECT: ""
          AITM_API_KEY: dev-key-change-in-production
          GEMINI_API_KEY: test-placeholder

      - name: Report backend summary
        if: always()
        run: |
          echo "## Backend CI" >> $GITHUB_STEP_SUMMARY
          COUNT=$(python -m pytest backend/tests/ --co -q 2>/dev/null | tail -1)
          echo "- Tests collected: $COUNT" >> $GITHUB_STEP_SUMMARY

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_API_KEY: dev-key-change-in-production

      - name: Report frontend summary
        if: always()
        run: |
          echo "## Frontend CI" >> $GITHUB_STEP_SUMMARY
          echo "- Build completed" >> $GITHUB_STEP_SUMMARY
